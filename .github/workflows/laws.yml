name: Rack laws

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Bend proofs and generated rack code
        shell: bash
        run: |
          archive="$RUNNER_TEMP/bend-2.0.40.tar.gz"
          tools="$RUNNER_TEMP/rack-laws"
          mkdir -p "$tools"
          curl --fail --location --retry 3 https://github.com/bendlang/bend/releases/download/v2.0.40/bend-2.0.40-linux-x64.tar.gz -o "$archive"
          printf '%s  %s\n' c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$tools"
          export BEND="$(find "$tools" -path '*/bin/bend' -type f -print -quit)"
          export RACK_KERNEL="$(find "$tools" -path '*/bend2/bendtt.lean' -type f -print -quit)"
          test -x "$BEND"
          test -f "$RACK_KERNEL"
          sudo apt-get update -qq
          sudo apt-get install -y elan
          elan toolchain install leanprover/lean4:v4.34.0
          export BENDTT="$tools/check-kernel"
          cat > "$BENDTT" <<'SH'
          #!/bin/sh
          exec elan run leanprover/lean4:v4.34.0 lean --run "$RACK_KERNEL" "$@"
          SH
          chmod +x "$BENDTT"
          npm run laws:check
      - run: npm test -- tests/rack/control-wiring.test.js tests/rack/module-contracts.test.js tests/audio/worklet-processor.test.js tests/dsp/{arp,ensemble-vco,joystick,scope,spectrogram,vca}.test.js
      - run: npm run audit:dsp -- --matrix --strict-voltage
      - if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium
      - if: github.event_name == 'pull_request'
        run: npx playwright test tests/e2e/hardware-controls.spec.js --project=chromium
